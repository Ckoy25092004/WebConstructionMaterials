services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vlxd_backend
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - db_data:/app
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vlxd_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
